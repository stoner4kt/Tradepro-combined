name: Dependency remediation

on:
  push:
    branches: [hardening/go-live]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: contains(github.event.head_commit.message, '[run-dependency-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/go-live
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply non-breaking and required major security updates
        run: npm audit fix --force
      - name: Validate updated dependencies
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run typecheck:worker -w server
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile and manifest updates
        run: |
          if git diff --quiet -- package.json package-lock.json server/package.json client/package.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/package.json client/package.json
          git commit -m "chore(deps): apply audited dependency security updates [skip ci]"
          git fetch origin hardening/go-live
          git rebase origin/hardening/go-live
          git push origin HEAD:hardening/go-live
